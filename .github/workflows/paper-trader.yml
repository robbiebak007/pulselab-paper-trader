name: Paper Trader

# Draait elke 5 minuten, plus handmatig via Actions tab
on:
  repository_dispatch:
    types: [paper_check]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Maximaal één run tegelijk, geen overlap
concurrency:
  group: paper-trader
  cancel-in-progress: false

# Workflow mag de repo zelf updaten (state file commit)
permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run paper trader (één cyclus)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python paper_trader.py --once --skip-validate --no-color

       - name: Commit state als gewijzigd
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "actions@github.com"
          git add paper_state.json
          if git diff --staged --quiet; then
            echo "Geen state-wijzigingen, niets om te committen"
            exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push gelukt op poging $i"
              exit 0
            fi
            echo "Push poging $i faalde, rebasing en opnieuw..."
            git pull --rebase origin main || true
            sleep 2
          done
          echo "Push faalde na 5 pogingen"
          exit 1
