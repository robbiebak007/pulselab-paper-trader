name: Paper Trader

# Draait via cron-job.org elke 5 min (repository_dispatch), plus backup-schedule en handmatig
on:
  repository_dispatch:
    types: [paper_check]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Maximaal één run tegelijk, geen overlap
concurrency:
  group: paper-trader
  cancel-in-progress: false

# Workflow mag de repo zelf updaten (state file commit)
permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run paper trader (één cyclus)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python paper_trader.py --once --skip-validate --no-color

      - name: Commit state met always-fresh-from-remote
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            cp paper_state.json /tmp/our_state.json 2>/dev/null || true
            git fetch origin main
            git checkout main 2>/dev/null || git checkout -B main
            git reset --hard origin/main
            cp /tmp/our_state.json paper_state.json 2>/dev/null || true
            git add paper_state.json
            if git diff --staged --quiet; then
              echo "Geen state-wijzigingen"
              exit 0
            fi
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            if git push origin main; then
              echo "Push gelukt op poging $i"
              exit 0
            fi
            echo "Push poging $i faalde, fresh fetch en opnieuw..."
            sleep 2
          done
          echo "Push faalde na 5 pogingen"
          exit 1
